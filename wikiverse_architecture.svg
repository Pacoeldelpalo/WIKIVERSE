<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#101b3a"/></linearGradient>
  <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102844"/><stop offset="1" stop-color="#111d35"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#eaf3ff"/></marker>
  <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#eaf3ff"/></marker>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#f4f8ff}.head{font:700 27px Arial,sans-serif;fill:#f4f8ff}
    .label{font:600 22px Arial,sans-serif;fill:#f4f8ff}.small{font:18px Arial,sans-serif;fill:#cbd8ee}
    .tiny{font:16px Arial,sans-serif;fill:#cbd8ee}.panel{fill:#09182b;stroke:#75baff;stroke-width:4}
    .service{fill:#111c35;stroke:#ff9d21;stroke-width:4}.third{fill:#111a35;stroke:#a66cff;stroke-width:4}
    .line{fill:none;stroke:#eaf3ff;stroke-width:4;marker-end:url(#arr)}
    .bi{fill:none;stroke:#eaf3ff;stroke-width:4;marker-start:url(#arr2);marker-end:url(#arr)}
    .dashed{fill:none;stroke:#ff9d21;stroke-width:4;stroke-dasharray:14 10}
  </style>
</defs>
<rect width="1800" height="1100" fill="url(#bg)"/>
<!-- subtle stars -->
<g fill="#9dcaff" opacity=".55">
<circle cx="120" cy="70" r="2"/><circle cx="280" cy="180" r="2"/><circle cx="520" cy="80" r="2"/><circle cx="760" cy="150" r="2"/><circle cx="1020" cy="70" r="2"/><circle cx="1290" cy="160" r="2"/><circle cx="1590" cy="80" r="2"/><circle cx="1720" cy="270" r="2"/><circle cx="220" cy="930" r="2"/><circle cx="600" cy="1020" r="2"/><circle cx="980" cy="970" r="2"/><circle cx="1450" cy="1010" r="2"/>
</g>
<text x="900" y="65" text-anchor="middle" class="title">Wikiverse — Architecture Overview</text>

<!-- Outside AWS -->
<rect x="35" y="125" width="330" height="850" rx="28" class="panel"/>
<text x="200" y="175" text-anchor="middle" class="head">Outside AWS Cloud</text>
<rect x="75" y="220" width="250" height="145" rx="20" fill="#102746" stroke="#75baff" stroke-width="2"/>
<text x="200" y="275" text-anchor="middle" class="head">Users / Clients</text>
<text x="200" y="315" text-anchor="middle" class="small">Web browser</text>
<rect x="75" y="435" width="250" height="145" rx="20" fill="#102746" stroke="#75baff" stroke-width="2"/>
<text x="200" y="490" text-anchor="middle" class="head">SphereX</text>
<text x="200" y="530" text-anchor="middle" class="small">Image source / uploads</text>
<rect x="75" y="690" width="250" height="170" rx="20" fill="#102746" stroke="#75baff" stroke-width="2"/>
<text x="200" y="750" text-anchor="middle" class="head">NASA / IPAC IRSA</text>
<text x="200" y="790" text-anchor="middle" class="small">Astronomical data</text>
<text x="200" y="820" text-anchor="middle" class="tiny">External archive</text>

<!-- AWS Cloud -->
<rect x="405" y="125" width="1000" height="850" rx="30" fill="url(#aws)" stroke="#ff9d21" stroke-width="5" filter="url(#glow)"/>
<text x="455" y="180" class="head">AWS Cloud</text>
<!-- AZ around EC2 only -->
<rect x="465" y="230" width="390" height="500" rx="22" class="dashed"/>
<rect x="525" y="210" width="270" height="45" rx="12" fill="#6b3908" stroke="#ff9d21" stroke-width="2"/>
<text x="660" y="241" text-anchor="middle" class="label">Availability Zone A</text>
<rect x="510" y="300" width="300" height="190" rx="20" class="service"/>
<text x="660" y="375" text-anchor="middle" class="head">Amazon EC2</text>
<text x="660" y="415" text-anchor="middle" class="label">Wikiverse Page</text>
<text x="660" y="455" text-anchor="middle" class="small">Frontend / HTTP</text>

<!-- FastAPI -->
<rect x="960" y="330" width="350" height="155" rx="22" fill="#20104b" stroke="#a66cff" stroke-width="4" filter="url(#glow)"/>
<text x="1135" y="415" text-anchor="middle" class="head">FastAPI</text>
<text x="1135" y="455" text-anchor="middle" class="small">Backend API</text>

<!-- S3 Lambda SNS row -->
<rect x="500" y="790" width="230" height="125" rx="20" fill="#123d26" stroke="#54d887" stroke-width="4"/>
<text x="615" y="845" text-anchor="middle" class="head">Amazon S3</text>
<text x="615" y="880" text-anchor="middle" class="small">Image storage</text>
<rect x="835" y="790" width="230" height="125" rx="20" fill="#27114f" stroke="#a66cff" stroke-width="4"/>
<text x="950" y="845" text-anchor="middle" class="head">AWS Lambda</text>
<text x="950" y="880" text-anchor="middle" class="small">S3 event handler</text>
<rect x="1170" y="790" width="190" height="125" rx="20" fill="#4b1238" stroke="#ff4f9a" stroke-width="4"/>
<text x="1265" y="845" text-anchor="middle" class="head">Amazon SNS</text>
<text x="1265" y="880" text-anchor="middle" class="small">Notifications</text>

<!-- Third party services -->
<rect x="1450" y="220" width="315" height="540" rx="26" class="third"/>
<text x="1607" y="270" text-anchor="middle" class="head">Third-Party Services</text>
<rect x="1480" y="310" width="255" height="150" rx="18" fill="#171e42" stroke="#a66cff" stroke-width="2"/>
<text x="1607" y="370" text-anchor="middle" class="head">AstroQuery</text>
<text x="1607" y="410" text-anchor="middle" class="small">Python package</text>
<rect x="1480" y="505" width="255" height="150" rx="18" fill="#171e42" stroke="#35b9ff" stroke-width="2"/>
<text x="1607" y="565" text-anchor="middle" class="head">SQLite</text>
<text x="1607" y="605" text-anchor="middle" class="small">Current database</text>

<!-- Connections -->
<!-- user <-> EC2 -->
<path d="M325 290 H500" class="bi"/>
<text x="410" y="270" text-anchor="middle" class="tiny">HTTP</text>
<!-- EC2 <-> FastAPI -->
<path d="M810 385 H960" class="bi"/>
<text x="885" y="360" text-anchor="middle" class="tiny">API / response</text>
<!-- FastAPI <-> AstroQuery -->
<path d="M1310 385 H1480" class="bi"/>
<!-- FastAPI <-> SQLite -->
<path d="M1135 485 V580 H1480" class="bi"/>
<!-- SphereX -> S3 -->
<path d="M325 510 H430 V850 H500" class="line"/>
<text x="410" y="490" text-anchor="middle" class="tiny">Image upload</text>
<!-- S3 -> Lambda -> SNS -->
<path d="M730 850 H835" class="line"/>
<path d="M1065 850 H1170" class="line"/>
<!-- SNS -> users, routed along bottom/outside but not across other components -->
<path d="M1265 915 V945 H385 V345 H325" class="line"/>
<text x="820" y="970" text-anchor="middle" class="small">User notifications</text>
<!-- IRSA -> FastAPI separate data path, avoid SNS -->
<path d="M325 775 H385 V690 H900 V455 H960" class="line"/>
<text x="630" y="670" text-anchor="middle" class="tiny">Astronomical data requests</text>

</svg>